<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UK Auto-Divert Nav</title>
  <link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css" />
  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/services/services-web.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; background: #111; }
    #map { height: 100%; width: 100%; }
    #panel {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: rgba(20, 22, 28, 0.94); color: #fff; padding: 14px;
      border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }
    .row { display: flex; gap: 8px; margin-bottom: 6px; position: relative; }
    input {
      flex: 1; padding: 11px; border-radius: 8px; border: 1px solid #333;
      background: #222630; color: #fff; font-size: 15px;
    }
    button {
      padding: 11px 16px; border-radius: 8px; border: none;
      background: #007aff; color: #fff; font-weight: 600; font-size: 15px;
    }
    #suggestions {
      position: absolute; top: 48px; left: 0; right: 64px; background: #222630;
      border: 1px solid #333; border-radius: 8px; max-height: 180px; overflow-y: auto;
      z-index: 20; display: none;
    }
    .suggestion-item {
      padding: 10px 12px; border-bottom: 1px solid #333; font-size: 14px; color: #fff; cursor: pointer;
    }
    #status { font-size: 13px; color: #a0aec0; line-height: 1.4; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="row">
      <input id="destInput" type="text" placeholder="Enter destination or postcode..." autocomplete="off" />
      <div id="suggestions"></div>
      <button onclick="startDirectRoute()">Go</button>
    </div>
    <div id="status">Waiting for GPS signal...</div>
  </div>
  <div id="map"></div>

  <script>
    const API_KEY = "xo9INe5sWpthdYHRjkFKjH95KVHVGhuY";
    let userPos = [-1.467, 52.523]; // Fallback to Nuneaton center
    let destPos = null;
    let routeLayerId = null;

    const map = tt.map({
      key: API_KEY,
      container: "map",
      center: userPos,
      zoom: 13,
      stylesVisibility: { trafficFlow: true, trafficIncidents: true }
    });

    const userMarker = new tt.Marker({ color: "#007aff" }).setLngLat(userPos).addTo(map);

    navigator.geolocation.watchPosition(
      (pos) => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        userMarker.setLngLat(userPos);
        document.getElementById("status").innerText = "GPS locked. Ready.";
      },
      () => { document.getElementById("status").innerText = "Using default location."; },
      { enableHighAccuracy: true, maximumAge: 2000 }
    );

    const destInput = document.getElementById("destInput");
    const suggestionsBox = document.getElementById("suggestions");

    destInput.addEventListener("input", async (e) => {
      const query = e.target.value.trim();
      if (query.length < 3) {
        suggestionsBox.style.display = "none";
        return;
      }

      try {
        const res = await tt.services.fuzzySearch({
          key: API_KEY,
          query: query,
          countrySet: "GB",
          limit: 5
        });

        if (res.results && res.results.length > 0) {
          suggestionsBox.innerHTML = "";
          res.results.forEach(item => {
            const div = document.createElement("div");
            div.className = "suggestion-item";
            div.innerText = item.poi ? `${item.poi.name}, ${item.address.freeformAddress}` : item.address.freeformAddress;
            
            const chooseDest = (evt) => {
              evt.preventDefault();
              destInput.blur();
              destPos = [item.position.lng, item.position.lat];
              destInput.value = div.innerText;
              suggestionsBox.style.display = "none";
              calculateAndDrawRoute();
            };

            div.addEventListener("click", chooseDest);
            div.addEventListener("touchend", chooseDest);
            suggestionsBox.appendChild(div);
          });
          suggestionsBox.style.display = "block";
        }
      } catch (err) {
        console.error(err);
      }
    });

    async function startDirectRoute() {
      destInput.blur();
      suggestionsBox.style.display = "none";
      const query = destInput.value.trim();
      if (!query) return;

      document.getElementById("status").innerText = "Finding destination...";
      try {
        const geoRes = await tt.services.fuzzySearch({ key: API_KEY, query: query, countrySet: "GB" });
        if (!geoRes.results || geoRes.results.length === 0) {
          document.getElementById("status").innerText = "Destination not found.";
          return;
        }

        destPos = [geoRes.results[0].position.lng, geoRes.results[0].position.lat];
        calculateAndDrawRoute();
      } catch (err) {
        document.getElementById("status").innerText = "Search error.";
      }
    }

    async function calculateAndDrawRoute() {
      if (!userPos || !destPos) return;

      document.getElementById("status").innerText = "Calculating route...";
      try {
        // TomTom Web Services calculateRoute expects locations as array of objects or coordinate pairs
        const routeRes = await tt.services.calculateRoute({
          key: API_KEY,
          locations: `${userPos[0]},${userPos[1]}:${destPos[0]},${destPos[1]}`,
          traffic: true,
          routeType: "fastest"
        });

        const geojson = routeRes.toGeoJson();
        
        if (map.getLayer("route")) {
          map.removeLayer("route");
          map.removeSource("route");
        }

        map.addLayer({
          id: "route",
          type: "line",
          source: { type: "geojson", data: geojson },
          paint: { "line-color": "#00d4ff", "line-width": 6 }
        });

        const summary = routeRes.routes[0].summary;
        const mins = Math.round(summary.travelTimeInSeconds / 60);
        document.getElementById("status").innerText = `Route loaded successfully! ETA: ${mins} mins.`;
      } catch (err) {
        console.error("Routing error:", err);
        document.getElementById("status").innerText = "Route calculation failed.";
      }
    }
  </script>
</body>
</html>
